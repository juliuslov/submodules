name: Services
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Lua 5.1 unit and cross-language integration tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r tests/requirements.txt
          .venv/bin/python tests/run_lua.py
      - name: Install pinned Neovim for headless integration tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ci
          gh release download v0.11.5 --repo neovim/neovim --pattern nvim-linux-x86_64.tar.gz --dir .ci
          tar -xzf .ci/nvim-linux-x86_64.tar.gz -C .ci
      - name: Test real Neovim process and buffer integration
        run: .ci/nvim-linux-x86_64/bin/nvim --headless -u NONE -l tests/headless.lua
